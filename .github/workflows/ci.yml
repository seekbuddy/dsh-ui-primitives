name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Verify package and consumers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Build package
        run: npm run build

      - name: Verify packed contents
        run: npm run test:package

      - name: Verify React 18 consumer
        run: npm run test:react18

      - name: Verify Next 16 / React 19 consumer
        run: npm run test:next16

      - name: Build demo
        run: npm run demo:build

      - name: Build Pages site
        run: npm run build:site
